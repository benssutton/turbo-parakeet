# Local SonarQube Community Build (http://localhost:9000). Start / stop:
#   docker compose -f sonar/compose.yml up -d
#   docker compose -f sonar/compose.yml down      (add -v to also drop the analysis history)
# First start takes a minute or two; log in as admin / admin and set a new password,
# then create a token (My Account → Security) and export it as SONARQUBE_TOKEN
# (see sonar/README.md).
services:
  sonarqube:
    image: sonarqube:community
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # Local dev only: skip the Elasticsearch host checks (vm.max_map_count) under WSL2.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - sonar_db:/var/lib/postgresql/data
volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  sonar_db:
