[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "analytics"
version = "0.1"
description = "Column-relationship analytics over Arrow data, with a Rust core"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.41",
]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
]

