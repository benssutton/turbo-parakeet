[package]
name = "analytics"
version = "0.1.0"
edition = "2021"

# Specify instructions on how to build the library
[lib]
name = "analytics"
crate-type = ["cdylib"] # dynamic system library with a C-compatible Foreign Function Interface

[features]
default = ["python"]
# The pyo3 binding (python.rs). Off for the C ABI build used by Java:
# cargo build --release --no-default-features --target-dir target/capi
python = ["dep:pyo3"]

[dependencies]
#Polars (kernels) and pyo3 (python.rs)
polars = { version = "0.51.0", features = ["lazy", "performant", "dtype-decimal", "dtype-struct", "dtype-array", "dtype-categorical", "timezones"] }
polars-arrow = { version = "0.51.0", default-features = false }
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py39"], optional = true }

#Concurrent hashmaps & hashing functions
xxhash-rust = { version = "0.8", features = ["xxh3"] }
foldhash = "0.1"

#Parallelism
rayon = "1.10"

#SIMD
wide = "0.7"        # Portable SIMD operations
mimalloc = "0.1.48"

#Statistics
statrs = "0.18"

#GCD (Stein's binary algorithm)
gcd = "2.3"

#describe: IPC ZSTD sizes, shortest float repr, time zones, buffer casts
zstd = "0.13"
ryu = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"

#Arrow-native core (recommend.rs, sizes.rs): arrow-rs, fed zero-copy through the C Data Interface
arrow-array = { version = "60", features = ["ffi", "chrono-tz"] }
arrow-buffer = "60"
arrow-cast = "60"
arrow-data = { version = "60", features = ["ffi"] }
arrow-schema = { version = "60", features = ["ffi"] }
arrow-select = "60"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3

[profile.bench]
lto = "thin"
codegen-units = 1