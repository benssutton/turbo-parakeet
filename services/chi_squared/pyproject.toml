[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chi_squared"
version = "0.1.0"
description = "Pairwise chi-squared independence tests on Polars DataFrames using polars-ds"
requires-python = ">=3.10"
dependencies = [
    "polars>=0.19.0",
    "polars-ds",
]

[project.optional-dependencies]
benchmark = [
    "scipy",
]
