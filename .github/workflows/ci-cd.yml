name: Full CI Pipeline

# The build / lint / test steps are the same commands as local development:
#   python scripts/check.py <step>      (see that file; tool versions: requirements-dev.txt,
#   Rust compiler: rust-toolchain.toml). Run `python scripts/check.py ci` before pushing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'  # Weekly (Mondays) — this repo changes slowly; never more often
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch / PR supersedes a running one (never cancel main).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

# Actions are pinned by commit SHA (the comment is the tag); Dependabot keeps them current.
jobs:
  # ==========================================================================
  # LINTING: rustfmt, black, clippy (both feature sets), ruff
  # ==========================================================================
  lint:
    name: Linting & Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: services/analytics

      - name: Install linting tools
        run: python -m pip install -r requirements-dev.txt

      - name: Format check and lint
        run: python scripts/check.py fast

  # ==========================================================================
  # RUST TESTS & COVERAGE
  # ==========================================================================
  rust-coverage:
    name: Rust Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # pyo3 links against a Python (--all-features).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: services/analytics

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-llvm-cov

      - name: Run Rust tests with coverage
        run: python scripts/check.py coverage-rust

      - name: Rust coverage HTML report
        working-directory: services/analytics
        run: cargo llvm-cov report --html --output-dir coverage-html

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: ./services/analytics/lcov.info
          flags: rust
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Rust coverage HTML artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rust-coverage-report
          path: services/analytics/coverage-html

  # ==========================================================================
  # BUILD BINDINGS (MATURIN) + PYTHON TESTS — Linux and Windows
  # ==========================================================================
  python-tests:
    name: Python Tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: services/analytics

      # `maturin develop` requires a virtualenv, so create one and make it active
      # for all following steps.
      - name: Create virtualenv
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = Windows ]; then bin=Scripts; else bin=bin; fi
          echo "$GITHUB_WORKSPACE/.venv/$bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Build Rust extension with Maturin
        run: python scripts/check.py build

      - name: Verify extension imports
        run: python -c "import analytics; print('analytics module loaded')"

      - name: Run Python tests with coverage
        run: python scripts/check.py coverage-py

      - name: Upload Python coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: ./coverage.xml
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================================================
  # JAVA BINDING (C ABI + PANAMA FFM) TESTS
  # ==========================================================================
  java-tests:
    name: Java Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: services/analytics

      # Builds the C ABI library (no Python, own target dir), then ./mvnw test.
      - name: Build the C ABI library and run the Java tests
        run: python scripts/check.py test-java

      - name: Upload Surefire reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: surefire-reports
          path: services/analytics/bindings/java/target/surefire-reports

  # ==========================================================================
  # CODEQL
  # ==========================================================================
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CodeQL on private repos needs GitHub Advanced Security.
    # Remove this line if you have it enabled (or the repo is public).
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: python, rust, java-kotlin
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3

  # ==========================================================================
  # SEMGREP
  # ==========================================================================
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Semgrep scan
        run: >
          semgrep scan
          --config p/default
          --sarif --sarif-output=semgrep.sarif

      - name: Upload SARIF to GitHub Security tab
        # Uploading needs code scanning to be available on the repo
        if: ${{ always() && !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: semgrep.sarif

      - name: Keep SARIF as an artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  # ==========================================================================
  # STATUS CHECK (single job to use for branch protection)
  # ==========================================================================
  status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint
      - rust-coverage
      - python-tests
      - java-tests
      - codeql
      - semgrep

    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || \
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more jobs failed"
            exit 1
          fi
