name: Full CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'  # Weekly coverage report

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================================================
  # RUST TESTS & COVERAGE - runs before Python tests
  # ============================================================================
  rust-coverage:
    name: Rust Tests & Coverage
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust (stable + llvm-tools)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/analytics
      
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      
      - name: Run Rust tests with coverage
        working-directory: services/analytics
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --all-features --workspace \
            --lcov --output-path lcov.info
          cargo llvm-cov --all-features --workspace \
            --html --output-dir coverage-html
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./services/analytics/lcov.info
          flags: rust
          fail_ci_if_error: false
      
      - name: Upload coverage HTML artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-coverage-report
          path: services/analytics/coverage-html

  # ============================================================================
  # BUILD PYTHON BINDINGS WITH MATURIN
  # ============================================================================
  build-python-bindings:
    name: Build Python Bindings
    runs-on: ubuntu-latest
    needs: rust-coverage  # Wait for Rust tests to complete
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/analytics
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
      
      - name: Build Python bindings with Maturin (develop mode)
        run: |
          cd services/analytics
          maturin develop --release
      
      - name: Verify bindings were built
        run: python -c "import analytics; print('Analytics module loaded successfully')"

  # ============================================================================
  # PYTHON TESTS (depends on Maturin build)
  # ============================================================================
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: build-python-bindings
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/analytics
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest pytest-cov
          # Install any additional requirements
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      
      - name: Build Python bindings again
        run: |
          cd services/analytics
          maturin develop --release
      
      - name: Run Python tests with coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=html
      
      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: python
          fail_ci_if_error: false

  # ============================================================================
  # CODE QUALITY SCANNING
  # ============================================================================
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ['python', 'cpp']
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  semagrep:
    name: Semagrep SAST Scan
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Semagrep scan
        run: semgrep ci --json --json-output semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      
      - name: Upload to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  # ============================================================================
  # LINTING & CODE QUALITY (optional but recommended)
  # ============================================================================
  lint:
    name: Linting & Formatting
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff black
      
      - name: Check Rust formatting
        working-directory: services/analytics
        run: cargo fmt --all -- --check
      
      - name: Run Rust clippy
        working-directory: services/analytics
        run: cargo clippy --all-features --all-targets -- -D warnings
      
      - name: Check Python formatting
        run: black --check .
      
      - name: Run Ruff linter
        run: ruff check .

  # ============================================================================
  # STATUS CHECK
  # ============================================================================
  status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    if: always()
    needs:
      - rust-coverage
      - python-tests
      - codeql
      - semagrep
      - lint
    
    steps:
      - name: Check workflow status
        run: |
          if [[ "${{ needs.rust-coverage.result }}" == "failure" ]]; then
            echo "::error::Rust coverage job failed"
            exit 1
          fi
          if [[ "${{ needs.python-tests.result }}" == "failure" ]]; then
            echo "::error::Python tests job failed"
            exit 1
          fi
          if [[ "${{ needs.codeql.result }}" == "failure" ]]; then
            echo "::error::CodeQL analysis failed"
            exit 1
          fi
          if [[ "${{ needs.semagrep.result }}" == "failure" ]]; then
            echo "::error::Semagrep scan failed"
            exit 1
          fi
          if [[ "${{ needs.lint.result }}" == "failure" ]]; then
            echo "::warning::Linting failed"
          fi