name: Full CI Pipeline

# The build / lint / test steps are the same commands as local development:
#   python scripts/check.py <step>      (see that file; tool versions: requirements-dev.txt,
#   Rust compiler: rust-toolchain.toml). Run `python scripts/check.py ci` before pushing.

# Cost control (private repo: Linux minutes 1x, Windows 2x of a monthly allowance):
#   - docs-only changes do not run the pipeline;
#   - the Windows Python job runs only on the weekly schedule / manual dispatch;
#   - Java runs on pushes to main, the schedule and dispatch, not on pull requests, against a
#     C library built without fat LTO (the schedule / dispatch also run the release build);
#   - CodeQL (the slowest job, hence the longest pipeline) runs on pull requests, the schedule
#     and dispatch, not on pushes to main;
#   - the Python tests run once on Linux, inside the Rust coverage job.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'sonar/**'
      - 'notebooks/**'
      - '.mcp.json'
      - '.claude/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'sonar/**'
      - 'notebooks/**'
      - '.mcp.json'
      - '.claude/**'
  schedule:
    - cron: '0 0 * * 1'  # Weekly (Mondays) — this repo changes slowly; never more often
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch / PR supersedes a running one (only the latest commit's
# result matters; a burst of merges runs one pipeline, not one per merge).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Actions are pinned by commit SHA (the comment is the tag); Dependabot keeps them current.
jobs:
  # ==========================================================================
  # LINTING: rustfmt, black, clippy (both feature sets), ruff
  # ==========================================================================
  lint:
    name: Linting & Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: services/analytics

      - name: Install linting tools
        run: python -m pip install -r requirements-dev.txt

      - name: Format check and lint
        run: python scripts/check.py fast

  # ==========================================================================
  # RUST TESTS & COVERAGE
  # ==========================================================================
  rust-coverage:
    name: Rust Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pyo3 links against a Python (--all-features), and the Python tests drive an
      # instrumented build of the extension (python.rs is only reachable from Python).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: services/analytics

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-llvm-cov

      # `maturin develop` requires a virtualenv.
      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      # Unit tests + the Python tests against an instrumented extension (the `coverage`
      # Cargo profile: no LTO), merged into lcov.info and coverage-html.
      - name: Run Rust and Python tests with Rust coverage
        run: python scripts/check.py coverage-rust-full

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./services/analytics/lcov.info
          flags: rust
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: python
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Rust coverage HTML artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rust-coverage-report
          path: services/analytics/coverage-html

  # ==========================================================================
  # PYTHON TESTS ON WINDOWS (release build) — weekly / manual only: 2x billing, and the
  # Linux Python tests run in the Rust coverage job on every push
  # ==========================================================================
  python-tests-windows:
    name: Python Tests (windows-latest, release build)
    runs-on: windows-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: services/analytics

      # `maturin develop` requires a virtualenv.
      - name: Create virtualenv
        shell: bash
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Build Rust extension with Maturin
        run: python scripts/check.py build

      - name: Verify extension imports
        run: python -c "import analytics; print('analytics module loaded')"

      - name: Run Python tests
        run: python scripts/check.py test-py

  # ==========================================================================
  # JAVA BINDING (C ABI + PANAMA FFM) TESTS
  # ==========================================================================
  java-tests:
    name: Java Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: services/analytics

      # Builds the C ABI library (no Python, own target dir, Cargo profile `ci`), then
      # ./mvnw test (with JaCoCo).
      - name: Build the C ABI library and run the Java tests
        run: python scripts/check.py test-java

      # The shipped build (fat LTO), weekly only: it is the slow part of this job.
      - name: Java tests against the release C library
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          CAPI_PROFILE: release
        run: python scripts/check.py test-java

      - name: Upload Surefire reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: surefire-reports
          path: services/analytics/bindings/java/target/surefire-reports

  # ==========================================================================
  # CODEQL
  # ==========================================================================
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CodeQL on private repos needs GitHub Advanced Security. It is the slowest job, so a push
    # to main skips it (pull requests, the weekly schedule and dispatch run it).
    if: ${{ !github.event.repository.private && github.event_name != 'push' }}
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python, rust, java-kotlin
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  # ==========================================================================
  # SEMGREP
  # ==========================================================================
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep scan
        run: >
          semgrep scan
          --config p/default
          --sarif --sarif-output=semgrep.sarif

      - name: Upload SARIF to GitHub Security tab
        # Uploading needs code scanning to be available on the repo
        if: ${{ always() && !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif

      - name: Keep SARIF as an artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  # ==========================================================================
  # STATUS CHECK (single job to use for branch protection)
  # ==========================================================================
  status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint
      - rust-coverage
      - python-tests-windows
      - java-tests
      - codeql
      - semgrep

    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || \
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more jobs failed"
            exit 1
          fi
