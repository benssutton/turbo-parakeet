# Version updates (security updates are separate and immediate). This repo changes slowly
# and CI minutes are limited (every Cargo.lock change invalidates the Rust build cache, so a
# run costs ~3x more): Rust and Python weekly, Java and Actions monthly; updates are grouped
# and at most 2 PRs per ecosystem are open at once.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /services/analytics
    ignore:
      # Rust polars and polars-arrow move together (and with the Python polars the extension
      # exchanges Arrow data with); 0.51 -> 0.53 breaks the build (polars-arrow types, the
      # Decimal dtype). Migrate deliberately, not by PR.
      - dependency-name: "polars"
      - dependency-name: "polars-arrow"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      rust:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /services/analytics/bindings/java
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      java:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
