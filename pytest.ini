[pytest]
testpaths = tests
# 4 pytest-xdist workers everywhere (requirements-dev.txt); `-n 0` for a serial run / debugger.
addopts = -n 4
pythonpath = .
python_files = test_*.py
norecursedirs = .* __pycache__ performance
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = module
