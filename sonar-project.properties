sonar.projectKey=turbo-parakeet
sonar.projectName=turbo-parakeet
sonar.sourceEncoding=UTF-8

sonar.sources=services/analytics/analytics,services/analytics/src,services/analytics/bindings/java/src/main
sonar.tests=tests,services/analytics/bindings/java/src/test
sonar.exclusions=**/target/**,notebooks/**,tests/data/**,tests/performance/results/**

sonar.python.version=3.12
# Written by `python scripts/check.py coverage-py`.
sonar.python.coverage.reportPaths=coverage.xml
# Written by the Java tests (JaCoCo, `python scripts/check.py test-java`).
sonar.coverage.jacoco.xmlReportPaths=services/analytics/bindings/java/target/site/jacoco/jacoco.xml
# Compiled by the Java tests (`python scripts/check.py test-java`).
sonar.java.binaries=services/analytics/bindings/java/target/classes
sonar.java.test.binaries=services/analytics/bindings/java/target/test-classes
